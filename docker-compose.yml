services:
  postgres:
    image: postgres:16-alpine
    container_name: yashraj_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yashraj
      POSTGRES_PASSWORD: yashraj123
      POSTGRES_DB: yashrajclinic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yashraj -d yashrajclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yashraj_net

  app:
    build: .
    container_name: yashraj_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yashraj:yashraj123@postgres:5432/yashrajclinic
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      JITSI_JAAS_APP_ID: ${JITSI_JAAS_APP_ID:-}
      JITSI_JAAS_KID: ${JITSI_JAAS_KID:-}
      JITSI_JAAS_PRIVATE_KEY: ${JITSI_JAAS_PRIVATE_KEY:-}
      JITSI_PATIENT_LINK_SECRET: ${JITSI_PATIENT_LINK_SECRET:-}
    networks:
      - yashraj_net

  nginx:
    image: nginx:alpine
    container_name: yashraj_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - yashraj_net

volumes:
  postgres_data:

networks:
  yashraj_net:
    driver: bridge
